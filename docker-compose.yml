# BidOps Admin 로컬 실행 구성.
#
# 애플리케이션은 산출물을 읽어서 보여주는 역할이므로, 이미지에는 웹 계층만 담고
# 실제 데이터(회차 산출물, 보고서, skill 스크립트, 회사 프로필)는 호스트에서
# 마운트한다. 이렇게 하면 파이프라인이 만든 새 산출물이 이미지를 다시 만들지
# 않아도 화면에 반영된다.

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: bidops-admin:local
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    # 파이프라인 실행은 호스트의 data/ 와 reports/ 에 파일을 만든다. 컨테이너가
    # root 로 돌면 그 파일을 호스트 사용자가 지우지 못하므로, 호스트와 같은
    # 사용자로 실행한다. uid·gid 가 1000 이 아니면 .env 에 지정하면 된다.
    user: "${BIDOPS_UID:-1000}:${BIDOPS_GID:-1000}"
    environment:
      BIDOPS_ROOT: /app
    volumes:
      # 파이프라인이 새 회차를 쓰므로 읽기·쓰기로 연결한다.
      - ./data:/app/data
      - ./reports:/app/reports
      # 실행 대상 스크립트와 판정 기준 문서는 애플리케이션이 고치지 않는다.
      - ./skills:/app/skills:ro
      - ./docs:/app/docs:ro
      # 데이터베이스와 첨부 원문. 컨테이너를 다시 만들어도 남는다.
      - bidops-web-data:/app/web/data
    restart: unless-stopped

volumes:
  bidops-web-data:

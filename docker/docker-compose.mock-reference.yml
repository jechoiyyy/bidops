# Test-only override for exercising the complete workflow without Qwen.
# It covers both stages: 1차 분류 uses the deterministic screening
# transport and 심층 검토 uses the mock analysis provider. The analysis worker
# remains on the internal database/analysis networks and the provider/model
# lineage is persisted as mock-analysis.
#
# Every value this overlay needs is declared literally below, so it needs no
# env file beyond the selected env/mock.env.
#
# 이 override로 만든 결과에는 quality_status=mock_reference 표식이 붙는다.
# 운영 완료·품질 근거·정책 활성화 근거가 아니다(ADR-0050).
#
#   make BIDOPS_ENV=mock up
#
# 분석 엔진의 회사 자료: 저장소 밖 로컬 사본 `wiki/`(원본 엔진 형식의 `<slug>.yaml` 묶음과
# 회사 위키 `<slug>/`)를 읽기 전용으로 붙인다. env/mock.env에
# BIDOPS_ENGINE_COMPANY_BUNDLE_SLUG=rootlab 을 주면 엔진 실행 입력이 그 자료와 위키를 싣고
# (engine-input v2), 비워 두면 기존 v1이다. 데모 임의값이 섞인 자료이므로 결과를 실제 입찰
# 판단에 그대로 쓰지 않는다.
services:
  web:
    environment:
      BIDOPS_ANALYSIS_PROVIDER: mock
      BIDOPS_SCREENING_PROVIDER: mock
      BIDOPS_OPENAI_ENABLED: "false"
      BIDOPS_REFERENCE_WORKFLOW_MODE: "true"
      BIDOPS_COMPANY_WIKI_INGEST_ENABLED: ${BIDOPS_COMPANY_WIKI_INGEST_ENABLED:-false}
      BIDOPS_COMPANY_WIKI_INGEST_APPLY_REFERENCE_ENABLED: ${BIDOPS_COMPANY_WIKI_INGEST_APPLY_REFERENCE_ENABLED:-false}
      BIDOPS_COMPANY_WIKI_INGEST_ACCESS_KEY: ${BIDOPS_COMPANY_WIKI_INGEST_ACCESS_KEY:-}
      BIDOPS_COMPANY_WIKI_INGEST_SECRET_KEY: ${BIDOPS_COMPANY_WIKI_INGEST_SECRET_KEY:-}
      BIDOPS_ENGINE_COMPANY_BUNDLE_DIR: /app/company-bundle
      BIDOPS_ENGINE_COMPANY_BUNDLE_SLUG: ${BIDOPS_ENGINE_COMPANY_BUNDLE_SLUG:-}
    volumes:
      - ./wiki:/app/company-bundle:ro
  analysis-worker:
    environment:
      BIDOPS_ENGINE_COMPANY_BUNDLE_DIR: /app/company-bundle
      BIDOPS_ENGINE_COMPANY_BUNDLE_SLUG: ${BIDOPS_ENGINE_COMPANY_BUNDLE_SLUG:-}
      BIDOPS_COMPANY_WIKI_BACKUP_DIR: ${BIDOPS_COMPANY_WIKI_BACKUP_DIR:-}
      BIDOPS_COMPANY_WIKI_INGEST_ENABLED: ${BIDOPS_COMPANY_WIKI_INGEST_ENABLED:-false}
      BIDOPS_COMPANY_WIKI_INGEST_APPLY_REFERENCE_ENABLED: ${BIDOPS_COMPANY_WIKI_INGEST_APPLY_REFERENCE_ENABLED:-false}
      BIDOPS_COMPANY_WIKI_INGEST_ACCESS_KEY: ${BIDOPS_COMPANY_WIKI_INGEST_ACCESS_KEY:-}
      BIDOPS_COMPANY_WIKI_INGEST_SECRET_KEY: ${BIDOPS_COMPANY_WIKI_INGEST_SECRET_KEY:-}
      BIDOPS_ANALYSIS_PROVIDER: mock
      BIDOPS_SCREENING_PROVIDER: mock
      BIDOPS_OPENAI_ENABLED: "false"
      BIDOPS_REFERENCE_WORKFLOW_MODE: "true"
    volumes:
      - ./wiki:/app/company-bundle:rw
      - ./backups/company-wiki:/app/company-wiki-backups:rw

server {
    listen 8080;
    server_name _;
    auth_basic "BidOps Portfolio";
    auth_basic_user_file /etc/nginx/portfolio.htpasswd;
    add_header Cache-Control "private, no-store" always;
    location / {
        proxy_pass http://web:8787;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
    }
}

# Production capabilities, selected only by BIDOPS_ENV=prod.
# Model and G2B egress remain separate; neither reaches document-worker.
# Approved C-2 inputs are read-only mounts, never image layers.
x-production-app: &production-app
  image: "${BIDOPS_IMAGE:?set the existing production application image tag}"
# State services come back after a host (Mac/OrbStack) restart. Only prod gets
# this; dev/mock keep the base file's default. analysis-worker stays without a
# restart policy on purpose (the operator starts it after a human check), and
# one-shot init/migrate services must not loop.
x-restart-state-service: &restart-state-service
  restart: unless-stopped
# 사전규격 개요의 플래그와 정책 경로. 개요 run을 등록하는 세 서비스(web의 사람 경로,
# analysis-worker의 실행, prespec-attachment-worker의 취득 종결 뒤 자동 준비·enqueue)가
# 같은 값을 봐야 한다 — 다르면 등록 때 동결한 정책 digest와 실행 정책이 어긋나 호출 전에
# `binding_mismatch`로 끝난다. 세 서비스가 이 anchor 하나를 병합한다.
x-prespec-overview-env: &prespec-overview-env
  BIDOPS_PRESPEC_OVERVIEW_ENABLED: "${BIDOPS_PRESPEC_OVERVIEW_ENABLED:-false}"
  BIDOPS_PRESPEC_OVERVIEW_POLICY_PATH: ${BIDOPS_PRESPEC_OVERVIEW_POLICY_PATH:-/app/web/backend/app/deep_review/policies/prespec-overview-policy-v7.json}
services:
  postgres: *restart-state-service
  minio: *restart-state-service
  clamav: *restart-state-service
  postgres-init: *production-app
  migrate: *production-app
  ro-backup: *production-app
  slack-worker: *production-app
  document-worker:
    image: "${BIDOPS_DOCUMENT_IMAGE:?set the existing native arm64 document worker image tag}"
    platform: linux/arm64
    <<: *restart-state-service
  minio-init:
    image: "${BIDOPS_MINIO_INIT_IMAGE:-bidops:minio-init}"
  web:
    <<: *production-app
    networks:
    - model-egress
    environment:
      BIDOPS_VLLM_SCREENING_BASE_URL: ${BIDOPS_VLLM_SCREENING_BASE_URL:-}
      BIDOPS_VLLM_SCREENING_ALLOWED_HOSTS: ${BIDOPS_VLLM_SCREENING_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_SCREENING_API_KEY: ${BIDOPS_VLLM_SCREENING_API_KEY:-EMPTY}
      BIDOPS_VLLM_SCREENING_MODEL_REVISION: ${BIDOPS_VLLM_SCREENING_MODEL_REVISION:-}
      BIDOPS_VLLM_SCREENING_API_DIALECT: ${BIDOPS_VLLM_SCREENING_API_DIALECT:-vllm}
      BIDOPS_VLLM_SCREENING_MODEL: ${BIDOPS_VLLM_SCREENING_MODEL:-qwen3.8-27B}
      BIDOPS_VLLM_OVERVIEW_BASE_URL: ${BIDOPS_VLLM_OVERVIEW_BASE_URL:-}
      BIDOPS_VLLM_OVERVIEW_ALLOWED_HOSTS: ${BIDOPS_VLLM_OVERVIEW_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_OVERVIEW_API_KEY: ${BIDOPS_VLLM_OVERVIEW_API_KEY:-EMPTY}
      BIDOPS_VLLM_OVERVIEW_MODEL_REVISION: ${BIDOPS_VLLM_OVERVIEW_MODEL_REVISION:-}
      BIDOPS_VLLM_OVERVIEW_API_DIALECT: ${BIDOPS_VLLM_OVERVIEW_API_DIALECT:-vllm}
      <<: *prespec-overview-env
      BIDOPS_VLLM_DEEP_REVIEW_BASE_URL: ${BIDOPS_VLLM_DEEP_REVIEW_BASE_URL:-}
      BIDOPS_VLLM_DEEP_REVIEW_ALLOWED_HOSTS: ${BIDOPS_VLLM_DEEP_REVIEW_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_DEEP_REVIEW_API_KEY: ${BIDOPS_VLLM_DEEP_REVIEW_API_KEY:-EMPTY}
      BIDOPS_VLLM_DEEP_REVIEW_MODEL_REVISION: ${BIDOPS_VLLM_DEEP_REVIEW_MODEL_REVISION:-}
      BIDOPS_VLLM_DEEP_REVIEW_API_DIALECT: ${BIDOPS_VLLM_DEEP_REVIEW_API_DIALECT:-vllm}
      BIDOPS_VLLM_BASE_URL: ${BIDOPS_VLLM_BASE_URL:-}
      BIDOPS_VLLM_ALLOWED_HOSTS: ${BIDOPS_VLLM_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_API_KEY: ${BIDOPS_VLLM_API_KEY:-EMPTY}
      BIDOPS_VLLM_MODEL_REVISION: ${BIDOPS_VLLM_MODEL_REVISION:-}
      BIDOPS_C2_EXECUTION_ALLOWED: ${BIDOPS_C2_EXECUTION_ALLOWED:-false}
      BIDOPS_C2_DAILY_TRIGGER_ENABLED: ${BIDOPS_C2_DAILY_TRIGGER_ENABLED:-false}
      BIDOPS_C2_CAPABILITIES_PATH: /run/c2/company-capabilities.json
      BIDOPS_C2_PROMPT_PATH: /run/c2/order-plan-prompt.txt
    volumes:
    - ${BIDOPS_C2_CAPABILITIES_HOST_PATH:?set an explicit approved capabilities file path}:/run/c2/company-capabilities.json:ro
    - ${BIDOPS_C2_PROMPT_HOST_PATH:?set an explicit approved prompt file path}:/run/c2/order-plan-prompt.txt:ro
  analysis-worker:
    <<: *production-app
    networks:
    - model-egress
    environment:
      BIDOPS_VLLM_OVERVIEW_BASE_URL: ${BIDOPS_VLLM_OVERVIEW_BASE_URL:-}
      BIDOPS_VLLM_OVERVIEW_ALLOWED_HOSTS: ${BIDOPS_VLLM_OVERVIEW_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_OVERVIEW_API_KEY: ${BIDOPS_VLLM_OVERVIEW_API_KEY:-EMPTY}
      BIDOPS_VLLM_OVERVIEW_MODEL_REVISION: ${BIDOPS_VLLM_OVERVIEW_MODEL_REVISION:-}
      BIDOPS_VLLM_OVERVIEW_API_DIALECT: ${BIDOPS_VLLM_OVERVIEW_API_DIALECT:-vllm}
      <<: *prespec-overview-env
      BIDOPS_VLLM_DEEP_REVIEW_BASE_URL: ${BIDOPS_VLLM_DEEP_REVIEW_BASE_URL:-}
      BIDOPS_VLLM_DEEP_REVIEW_ALLOWED_HOSTS: ${BIDOPS_VLLM_DEEP_REVIEW_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_DEEP_REVIEW_API_KEY: ${BIDOPS_VLLM_DEEP_REVIEW_API_KEY:-EMPTY}
      BIDOPS_VLLM_DEEP_REVIEW_MODEL_REVISION: ${BIDOPS_VLLM_DEEP_REVIEW_MODEL_REVISION:-}
      BIDOPS_VLLM_DEEP_REVIEW_API_DIALECT: ${BIDOPS_VLLM_DEEP_REVIEW_API_DIALECT:-vllm}
      BIDOPS_VLLM_BASE_URL: ${BIDOPS_VLLM_BASE_URL:-}
      BIDOPS_VLLM_ALLOWED_HOSTS: ${BIDOPS_VLLM_ALLOWED_HOSTS:-}
      BIDOPS_VLLM_API_KEY: ${BIDOPS_VLLM_API_KEY:-EMPTY}
      BIDOPS_VLLM_MODEL_REVISION: ${BIDOPS_VLLM_MODEL_REVISION:-}
      BIDOPS_C2_EXECUTION_ALLOWED: ${BIDOPS_C2_EXECUTION_ALLOWED:-false}
      BIDOPS_C2_CAPABILITIES_PATH: /run/c2/company-capabilities.json
      BIDOPS_C2_PROMPT_PATH: /run/c2/order-plan-prompt.txt
    volumes:
    - ${BIDOPS_C2_CAPABILITIES_HOST_PATH:?set an explicit approved capabilities file path}:/run/c2/company-capabilities.json:ro
    - ${BIDOPS_C2_PROMPT_HOST_PATH:?set an explicit approved prompt file path}:/run/c2/order-plan-prompt.txt:ro
  prespec-attachment-worker:
    <<: *production-app
    # 상시 실행 대상이다(2026-11-19 사전규격 단계 수정안 §5 #7). 기반 파일도 같은 값이지만
    # host 재시작 뒤 자동 기동은 운영 결정이므로 prod에서 명시한다.
    restart: unless-stopped
    networks:
    - prespec-egress
    environment:
      <<: *prespec-overview-env
      BIDOPS_G2B_ATTACHMENT_ENABLED: 'true'
      BIDOPS_G2B_ATTACHMENT_ALLOWED_HOSTS: ${BIDOPS_G2B_ATTACHMENT_ALLOWED_HOSTS:?set approved G2B attachment hosts in env/prespec-attachment.env}
networks:
  model-egress: null
  prespec-egress: null

<!doctype html><html lang="ko" data-astryx-theme="bidops"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BidOps · 사전규격 상세 시안</title>
<style>
[data-astryx-theme="bidops"]{--color-background-surface:light-dark(#FFFFFF,#232634)}
[data-astryx-theme="bidops"]{--color-background-muted:light-dark(#F6F5F3, #1C1E28);--color-accent:light-dark(#1D7B4E, #93A0B0);--color-text-primary:light-dark(#1B1B1A, #E8E4E2);--color-text-secondary:light-dark(#5E5D5A, #A9A6A4);--color-text-accent:light-dark(#1D7B4E, #93A0B0);--color-on-dark:#FFFFFF;--color-border:light-dark(#E4E3E0, #FFFFFF1A);--color-background-red:light-dark(#facecb, #ff9e973D);--color-text-red:light-dark(#89001a, #ffc6c1);--color-background-yellow:light-dark(#f8da9d, #deb4333D);--color-text-yellow:light-dark(#584400, #fdcf4f);--color-background-green:light-dark(#c5e5c0, #84c9803D);--color-text-green:light-dark(#0c5700, #9fe59b);--bo-frame:#eeedeb;--bo-sidebar-hover:#e6e5e2;--bo-sidebar-active:#e0dfdc;}
*{box-sizing:border-box}html{color-scheme:light;min-width:1280px}body{margin:0;background:var(--bo-frame);color:var(--color-text-primary);font:16px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.025em}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--color-border);background:var(--color-background-surface);padding:7px 13px;border-radius:7px;font-size:14px;font-weight:600}button:hover{background:var(--bo-sidebar-hover)}button:focus-visible,a:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}header,aside,main,section,article,footer,nav{display:block}#shell{display:grid;grid-template-columns:202px 1fr;padding:9px 9px 9px 0;min-height:100vh}.rail{padding:24px 16px;display:flex;flex-direction:column;gap:30px}.brand{font-size:25px;letter-spacing:-.065em;font-weight:800;display:flex;align-items:center;gap:9px}.brand svg{color:var(--color-accent)}.rail small,.muted,.meta,.crumb,small{color:var(--color-text-secondary)}.rail small{font-size:13px;display:block;margin:0 10px 8px}.navlink{display:block;font-size:15px;padding:8px 10px;border-radius:6px;color:inherit;text-decoration:none}.navlink.active{background:var(--bo-sidebar-active);font-weight:700}.rail footer{margin-top:auto;font-size:13px;color:var(--color-text-secondary)}.paper{background:var(--color-background-surface);border-radius:12px;padding:0 32px 32px;min-width:0}.toolbar,.flex,.bar,.actions,.filters{display:flex;align-items:center;gap:10px}.toolbar,.bar{justify-content:space-between}.toolbar{min-height:65px;border-bottom:1px solid var(--color-border)}.crumb{font-size:14px}.switch{display:flex;gap:2px;background:var(--color-background-muted);padding:3px;border-radius:8px}.switch button{background:transparent;border-color:transparent;color:var(--color-text-secondary)}.switch .on{background:var(--color-background-surface);border-color:var(--color-border);color:var(--color-text-primary)}.head{padding:24px 0 19px}.caseid,.code,.loc{font:13px ui-monospace,Menlo,monospace;letter-spacing:.01em;color:var(--color-text-secondary)}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,2.15vw,34px);letter-spacing:-.055em;line-height:1.35;margin:6px 0}h2{font-size:20px;letter-spacing:-.04em}h3{font-size:17px}.meta{font-size:14px}.meta b{color:var(--color-text-primary)}.primary,.primary:hover{background:var(--color-accent);color:var(--color-on-dark);border-color:var(--color-accent)}.actionbar{display:flex;align-items:center;justify-content:space-between;border-block:1px solid var(--color-border);padding:13px 0}.actionbar strong{margin-left:12px}.label{font-size:13px;font-weight:700;color:var(--color-text-secondary)}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.card{border:1px solid var(--color-border);border-radius:9px;padding:18px 20px;background:var(--color-background-muted)}.card p{font-size:15px;color:var(--color-text-secondary);margin:5px 0}.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:4px;padding:2px 8px}.bad{background:var(--color-background-red);color:var(--color-text-red)}.ask{background:var(--color-background-yellow);color:var(--color-text-yellow)}.ok{background:var(--color-background-green);color:var(--color-text-green)}.card h3{margin-top:10px}.link{border:0;background:none;padding:3px 0;text-decoration:underline;text-underline-offset:3px;color:var(--color-text-accent)}.bar{margin:17px 0 10px}.filters button{font-size:13px;padding:4px 10px}.filters .chosen{background:var(--bo-sidebar-active);border-color:var(--bo-sidebar-active)}table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;color:var(--color-text-secondary);font-weight:500;font-size:13px;background:var(--color-background-muted)}td,th{padding:11px 10px;border-bottom:1px solid var(--color-border)}td b{font-weight:600}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.86fr);gap:20px}.reader{background:var(--color-background-muted);padding:15px 18px;border-radius:9px}.source{padding:19px;background:var(--color-background-surface);border:1px solid var(--color-border);margin:13px 0}.source h3{font-family:"AppleMyungjo",serif;font-size:19px;margin:9px 0}.quote{border-left:3px solid var(--color-accent);padding:8px 12px;background:var(--color-background-green);font-size:16px}.fact{font-size:14px;margin-top:10px}.evidence-row{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;padding:12px;border-radius:0;border:0;border-bottom:1px solid var(--color-border)}.evidence-row[aria-pressed=true]{background:var(--color-background-muted);box-shadow:inset 3px 0 var(--color-accent)}.evidence-row small{font-weight:400}.brief{margin:12px 0;padding:10px 0;font-size:14px}.brief .tag{margin:0 6px 0 15px}.brief .tag:first-child{margin-left:0}.work{display:grid;grid-template-columns:220px 1fr;gap:23px;margin-top:18px}.workmenu{background:var(--color-background-muted);padding:15px;border-radius:8px;align-self:start}.workmenu button{display:flex;width:100%;justify-content:space-between;margin-top:7px;border:0;background:transparent}.workmenu .chosen{background:var(--color-background-surface);outline:1px solid var(--color-border)}.task{display:grid;grid-template-columns:1fr auto;gap:5px 12px;border-bottom:1px solid var(--color-border);padding:13px 0}.task p{font-size:14px;color:var(--color-text-secondary)}.task .actions{grid-column:2;grid-row:1/span 2}.below{margin-top:20px;padding:13px 0;border-top:1px solid var(--color-border);font-size:14px}.below summary{cursor:pointer;font-weight:700}.below p{margin-top:7px}dialog{color:inherit;border:1px solid var(--color-border);border-radius:12px;width:520px;padding:23px;background:var(--color-background-surface)}dialog::backdrop{background:rgb(0 0 0/.28)}dialog .bar{margin:0 0 15px}dialog .actions{margin-top:15px;flex-wrap:wrap}.drawer{margin:0 0 0 auto;height:100vh;max-height:none;border-radius:12px 0 0 12px}.sample{font-size:13px;color:var(--color-text-secondary)}@media(max-width:1320px){#shell{grid-template-columns:174px 1fr}.paper{padding-inline:24px}.card{padding:13px 16px}.split{grid-template-columns:1fr}.split>.reader{display:none}.work{grid-template-columns:180px 1fr}}
</style>
<body><div id="shell"><aside class="rail"><div class="brand"><svg width="24" height="27" viewBox="0 0 24 27" aria-hidden="true"><path fill="currentColor" d="M1 2h11c6 0 9 6 6 10 6 3 5 12-4 13H1z"/><path fill="white" d="M6 8h7v3H6zm0 8h10v3H6z"/></svg>BidOps</div><nav><small>사전규격 상세</small><a class="navlink active" href="#summary">검토 요약</a><a class="navlink" href="#requirements">요구사항 대응</a><a class="navlink" href="#attachments">개요 · 첨부</a></nav><footer>루트랩 · 예시 데이터</footer></aside><main class="paper"><div class="toolbar"><span class="crumb">사전규격　/　상세 검토</span><div class="switch" aria-label="시안 선택"></div></div><div id="page"></div></main></div><dialog id="modal"><div id="modalBody"></div></dialog>
<script>
const rows=[
 ['MHR-01','전담 책임자 현장 상주','차단','제안요청서 12쪽','사업 수행 기간 중 전담 책임자 1명은 수원 사업장에 상주하여야 한다.','예시 회사 기준에서 상주 가능 지역은 대구로 확인됐다.','회사 제한 · 수행 지역'],
 ['QUR-02','유사 사업 실적 인정 범위','미확인','제안요청서 18쪽','최근 3년 내 공공 데이터 플랫폼 구축 실적을 제출한다. 공동수급 실적은 참여 지분에 한하여 인정한다.','예시 실적의 공동수급 지분을 확인할 증빙이 필요하다.','실적증명서 · 참여 지분'],
 ['SEC-03','보안 담당자 자격 유효기간','미확인','제안요청서 24쪽','보안 담당자는 착수일에 유효한 정보보안 자격을 보유하여야 한다.','예시 회사 자료에서 지정 인력의 자격 만료일이 확인되지 않았다.','인력 증빙 · 만료일'],
 ['SFR-04','데이터 통합 대시보드 구축','충족','제안요청서 31쪽','수집 현황과 오류 이력을 단일 대시보드에서 조회할 수 있어야 한다.','예시 실적에서 통합 대시보드 설계와 구현 역할을 확인했다.','수행확인서 · 역할'],
 ['TER-05','인수 테스트 계획 제출','충족','제안요청서 42쪽','수행사는 인수 기준과 테스트 절차를 포함한 계획서를 제출한다.','예시 실적의 인수 테스트 계획서와 수행 범위가 대응한다.','수행확인서 · 범위']
];
const titles=['판단 요약형','원문 대조형','확인 과제형'];
let v=Math.max(0,Math.min(2,Number(new URLSearchParams(location.search).get('v')||1)-1))||0, selected=0,filter='전체',group='미확인',seen=new Set(),ack=false,tracking='미결정',trigger;
const q=s=>document.querySelector(s),tag=s=>'<span class="tag '+({차단:'bad',미확인:'ask',충족:'ok'}[s])+'">'+s+'</span>';
function action(){return '<div class="actionbar"><div><span class="label">지금 할 일</span><strong>'+(ack?'추적 여부 결정':'분석 결과와 근거 확인')+'</strong></div><button class="primary" data-act="decision">'+(ack?'추적 결정':'결과 확인')+'</button></div>'}
function source(i){let r=rows[i];return '<div class="reader"><div class="bar"><b>원문 근거</b><span class="loc">'+r[3]+'</span></div><div class="source"><small>제안요청서 · 정정 1차</small><h3>'+r[0]+'　'+r[1]+'</h3><p class="quote">'+r[4]+'</p></div><span class="label">대응 회사 근거 · 예시 버전 3</span><p class="fact">'+r[5]+'</p></div>'}
function table(){return '<section id="requirements"><div class="bar"><h2>요구사항 대응표</h2><div class="filters">'+['전체','차단','미확인','충족'].map(x=>'<button class="'+(x===filter?'chosen':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div></div><table><thead><tr><th>요구 ID</th><th>필수 요구사항</th><th>대응 상태</th><th>확인 근거</th><th>원문</th></tr></thead><tbody>'+rows.map((r,i)=>filter==='전체'||filter===r[2]?'<tr><td class="code">'+r[0]+'</td><td><b>'+r[1]+'</b></td><td>'+tag(r[2])+'</td><td>'+r[6]+'</td><td><button class="link" data-src="'+i+'">'+r[3]+'</button></td></tr>':'').join('')+'</tbody></table></section>'}
function brief(){return '<div class="brief">'+tag('차단')+' 수원 상주 조건　'+tag('미확인')+' 실적 지분 · 자격 만료일</div>'}
function view(){if(v===0)return action()+'<div class="cards"><article class="card">'+tag('차단')+'<h3>필수 상주 지역이 맞지 않습니다</h3><p>수원 현장 상주 의무와 회사의 대구 상주 범위가 충돌합니다.</p><button class="link" data-src="0">상주 조항 확인</button></article><article class="card">'+tag('미확인')+'<h3>추적 결정 전에 확인할 두 가지</h3><p>공동수급 실적의 지분과 보안 담당자 자격 만료일을 확인하세요.</p><button class="link" data-filter="미확인">미확인 요구사항 보기</button></article></div>'+table();
if(v===1)return action()+brief()+'<section id="requirements" class="split"><div><div class="bar"><h2>요구사항과 원문 대조</h2><small>5개 항목</small></div>'+rows.map((r,i)=>'<button class="evidence-row" aria-pressed="'+(selected===i)+'" data-read="'+i+'"><span><small>'+r[0]+' · 필수</small><br>'+r[1]+'</span>'+tag(r[2])+'</button>').join('')+'</div>'+source(selected)+'</section>';
let items=rows.map((r,i)=>({r,i})).filter(x=>group==='확인한 항목'?seen.has(x.i):x.r[2]===group&&!seen.has(x.i));
return action()+brief()+'<div class="work"><div class="workmenu"><b>검토할 항목</b>'+['미확인','차단','확인한 항목'].map(g=>'<button data-group="'+g+'" class="'+(group===g?'chosen':'')+'">'+g+'<span>'+(g==='확인한 항목'?seen.size:rows.filter((r,i)=>r[2]===g&&!seen.has(i)).length)+'</span></button>').join('')+'</div><section><div class="bar"><h2>'+group+(group==='미확인'?' 사항':'')+'</h2></div>'+items.map(({r,i})=>'<article class="task"><b>'+r[1]+'</b><p>'+r[5]+'</p><div class="actions"><button class="link" data-src="'+i+'">원문</button><button data-seen="'+i+'">'+(seen.has(i)?'읽음 취소':'읽음 표시')+'</button></div></article>').join('')+(!items.length?'<p class="muted">이 목록에 남은 항목이 없습니다.</p>':'')+'</section></div>'+table()}
function render(){q('.switch').innerHTML=titles.map((t,i)=>'<button aria-pressed="'+(v===i)+'" class="'+(v===i?'on':'')+'" data-v="'+i+'">'+String.fromCharCode(65+i)+' · '+t+'</button>').join('');
q('#page').innerHTML='<header id="summary" class="head"><span class="caseid">PS-DEMO-2026-014</span><h1>도시 데이터 통합 플랫폼 고도화</h1><p class="meta">가온시 정보정책과　 ·　의견 마감 <b>11. 23. (월) 18:00 KST</b>　 ·　추정 예산 4억 8천만 원　 ·　추적 '+tracking+'</p></header>'+view()+'<details class="below" id="attachments"><summary>사업 개요 · 분석에 사용한 첨부</summary><p>도시 데이터 수집 현황과 오류 이력을 통합하는 사업입니다. 예시 제안요청서 정정 1차를 기준으로 검토했습니다.</p></details>'}
function dialog(body,drawer=false){trigger=document.activeElement;let m=q('#modal');m.className=drawer?'drawer':'';q('#modalBody').innerHTML='<div class="bar"><span class="sample">시안 · 예시 데이터</span><button data-close>닫기</button></div>'+body;m.showModal()}
q('#modal').addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus();else q('[data-act="decision"]').focus()});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;
if(d.close!==undefined){q('#modal').close();return}
if(d.v!==undefined){v=+d.v;filter='전체';history.replaceState(null,'','?v='+(v+1));render()}
else if(d.filter){filter=d.filter;render();q('#requirements').scrollIntoView({block:'nearest'})}
else if(d.group){group=d.group;render()}
else if(d.seen!==undefined){let i=+d.seen;seen.has(i)?seen.delete(i):seen.add(i);render()}
else if(d.src!==undefined){dialog(source(+d.src),true)}
else if(d.read!==undefined){selected=+d.read;render();let btn=q('[data-read="'+selected+'"]');btn.focus();if(innerWidth<=1320)dialog(source(selected),true)}
else if(d.act==='decision'){dialog('<h2>'+(ack?'추적 결정':'분석 결과 확인')+'</h2><p class="fact">'+(ack?'이 예시 공고의 추적 상태를 선택하세요.':'차단 조건 1건과 미확인 사항 2건이 있습니다. 결과를 확인한 뒤 추적 여부를 따로 정할 수 있습니다.')+'</p><div class="actions">'+(ack?['계속 추적','보류','종료'].map(x=>'<button data-track="'+x+'">'+x+'</button>').join(''):'<button class="primary" data-ack>결과 확인 기록</button>')+'</div>')}
else if(d.ack!==undefined||d.track){ack=true;if(d.track)tracking=d.track;q('#modal').close();render();q('[data-act="decision"]').focus()}});
render();
</script></body></html>

<script>
const names=['판단 브리핑','근거 대조','후속 업무'];
const facts=[
 {id:'EQR-01',title:'예비 서버 납품',type:'차단',page:12,section:'장비 공급 조건',quote:'수행사는 운영 장비와 별도로 예비 서버 1대를 납품하여야 한다. 납품 확인서를 별도 성과물로 제출한다.',basis:'회사 수행 기준 · 확인본 3판',company:'독립적인 필수 하드웨어 납품은 수행 범위에서 제외한다.',why:'서버 납품과 별도 성과물 제출이 모두 필수이므로 회사 수행 기준과 충돌합니다.'},
 {id:'MHR-02',title:'핵심 인력 투입 가능 여부',type:'미확인',page:18,section:'인력 투입 계획',quote:'사업 착수일부터 중급 이상 유지관리 인력 1명을 전담 배치하여야 한다.',basis:'인력 경력표 · 예시 확인본',company:'중급 유지관리 경력은 확인됐습니다. 이 사업의 착수일 배정표가 필요합니다.',why:'기술책임자가 착수일 배정표로 전담인력의 가용성을 확인할 수 있습니다.'},
 {id:'MHR-03',title:'지정 장소 상주',type:'미확인',page:19,section:'근무 장소',quote:'상주 인력은 발주기관이 지정하는 장소에서 근무한다. 지정 장소는 입찰공고 시 공개한다.',basis:'회사 수행 기준 · 확인본 3판',company:'상주 가능 지역은 대구입니다. 발주처 주소로 근무 장소를 추정할 수 없습니다.',why:'본공고에 대구 외 장소가 지정되면 회사의 상주 기준과 충돌합니다.'},
 {id:'OPS-04',title:'장애 접수·복구 이력 관리',type:'충족',page:26,section:'서비스 운영',quote:'장애 접수 시각, 복구 조치와 완료 시각을 기록하고 월간 운영 보고서에 포함한다.',basis:'유사 실적 확인서 · 수행 범위 §2',company:'유사 플랫폼 운영에서 장애 이력 관리와 월간 보고를 수행했습니다.',why:'확인된 실적의 수행 범위가 장애 기록과 보고 요구를 포함합니다.'},
 {id:'TER-05',title:'인수 테스트 계획 제출',type:'충족',page:34,section:'시험 및 인수',quote:'기능별 시험 절차 및 인수 기준을 포함한 테스트 계획서를 제출한다.',basis:'시험계획서 · 수행 확인본',company:'확인된 실적의 시험계획서에 절차와 인수 기준이 포함되어 있습니다.',why:'기존 시험계획서와 수행 확인서에서 대응 근거를 찾았습니다.'}];
const labels=['A','B','C'], el=id=>document.getElementById(id), safe=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode=[1,2,3].includes(Number(new URLSearchParams(location.search).get('v')))?Number(new URLSearchParams(location.search).get('v'))-1:0,chosen=0,track='미결정',read=false,record=null,lastFocus;
function status(i){return i===1&&record?record.verdict:facts[i].type}
function pill(t){return '<span class="pill '+({차단:'red',미확인:'amber',충족:'green',부족:'red','분석 완료':'green'}[t]||'')+'">'+t+'</span>'}
function btn(t,attr='',cls=''){return '<button class="'+cls+'" '+attr+'>'+t+'</button>'}
function head(){return '<header class="head bar"><div><div class="kicker">'+pill('분석 완료')+'<span class="tiny">PS-DEMO-026</span></div><h1>도시 데이터 플랫폼 운영·유지관리</h1><div class="meta">가온시 정보정책과　·　사업비 3억 2천만 원　·　수행 기간 12개월</div></div><div class="decision"><div class="deadline"><small>의견 마감</small><strong>11. 23. (월) 18:00</strong></div><div class="deadline"><small>현재 추적 상태</small><strong>'+track+'</strong></div>'+btn('추적 결정','data-decide','primary')+'</div></header>'}
function table(compact=false){return '<section><div class="bar sec"><h2>요구사항 대응표</h2><span class="counts">검토한 요구사항 5건</span></div><table class="'+(compact?'dense':'')+'"><thead><tr><th>요구 ID</th><th>필수 요구사항</th><th>대응 상태</th><th>회사 근거</th><th>원문 근거</th></tr></thead><tbody>'+facts.map((r,i)=>'<tr><td class="tiny">'+r.id+'</td><td><b>'+r.title+'</b></td><td>'+pill(status(i))+'</td><td>'+r.basis+'</td><td>'+btn('제안요청서 '+r.page+'쪽','data-source="'+i+'"','text')+'</td></tr>').join('')+'</tbody></table></section>'}
function questions(){return '<div class="questions"><h3>추적 판단에 남은 질문</h3><div class="mini"><div><small>'+(record&&record.verdict!=='미확인'?'이 공고에서 확인':'지금 확인 · 기술책임자')+'</small><br><b>착수일에 전담 인력을 배정할 수 있나?</b></div>'+btn(record?'기록 보기':'확인하기','data-task')+'</div><div class="mini"><div><small>본공고 대기</small><br><b>상주 근무 장소는 어디인가?</b></div>'+btn('근거 보기','data-source="2"')+'</div></div>'}
function a(){return '<div class="hero"><div class="lead"><div class="mark">'+pill('차단')+'<small>회사 수행 제한</small></div><h2>예비 서버 납품이 추적 판단을 가릅니다</h2><p>별도 성과물로 요구된 장비 납품이 회사 기준과 충돌합니다.<br>이 의무가 정정되면 참여 조건을 다시 검토할 수 있습니다.</p><div class="chips">'+btn('차단 근거 대조','data-source="0"')+'</div></div>'+questions()+'</div>'+table()}
function sheet(i){let f=facts[i];return '<div class="sheet"><small>제안요청서 · 정정 1차</small><h3>'+f.section+'</h3><p class="quote">'+f.quote+'</p><footer>'+f.id+'　|　'+f.page+'쪽</footer></div>'}
function reasoning(i){let f=facts[i];return pill(status(i))+'<h3>'+f.title+'</h3><p>'+((i===1&&record)?safe(record.answer):f.why)+'</p><div class="rule"></div><small>회사 근거</small><h4>'+f.basis+'</h4><p>'+f.company+'</p>'+(i===1&&record?'<div class="rule"></div><small>이 공고의 추가 증빙</small><p>'+safe(record.proof)+'</p>':'')}
function strip(){return '<div class="summaryline"><div class="flex">'+pill('차단')+'<b>예비 서버 납품</b><span class="navline"></span>'+pill('미확인')+'<span>'+(record&&record.verdict!=='미확인'?'상주 장소':'착수일 인력 · 상주 장소')+'</span></div><small>원문 1개 · 회사 근거 3종</small></div>'}
function b(){return strip()+'<div class="bgrid"><div class="picker"><div class="cap"><h3>요구사항 대응</h3><small>5건</small></div>'+facts.map((f,i)=>'<button class="pick" data-pick="'+i+'" aria-pressed="'+(chosen===i)+'"><span><small>'+f.id+'</small>'+f.title+'</span>'+pill(status(i))+'</button>').join('')+'</div><div class="evidence"><div class="bar"><b>원문 발췌</b><span class="tiny">'+facts[chosen].page+' / 38쪽</span></div>'+sheet(chosen)+'</div><aside class="review"><small>근거 대조 결과</small><div class="rule"></div>'+reasoning(chosen)+(chosen===1?'<div class="rule"></div>'+btn('공고별 확인 기록','data-task'):'')+'</aside></div>'}
function c(){return '<div class="bar sec"><h2>추적 결정을 위한 후속 업무</h2><small>공고별 확인 기록</small></div><div class="lanes"><section class="lane current"><h3>'+(record&&record.verdict!=='미확인'?'확인 기록':'지금 확인')+'</h3><article>'+pill(status(1))+'<h4>착수일 전담 인력 배정</h4><p>'+(record?safe(record.answer):'기술책임자의 배정표가 있어야 이번 사업의 투입 여부를 확인할 수 있습니다.')+'</p>'+btn(record?'기록 보기':'확인 내용 기록','data-task')+'</article></section><section class="lane"><h3>자료 대기</h3><article>'+pill('미확인')+'<h4>발주기관의 지정 근무 장소</h4><p>본공고에 장소가 명시되면 대구 상주 기준과 대조합니다.</p>'+btn('기다리는 조항 보기','data-source="2"')+'</article></section><section class="lane"><h3>추적 결정에 반영</h3><article>'+pill('차단')+'<h4>독립적인 예비 서버 납품 의무</h4><p>현재 회사 제한과 충돌합니다. 정정 시 납품 의무의 삭제·변경을 재확인합니다.</p>'+btn('원문과 회사 기준','data-source="0"')+'</article></section></div>'+table(true)}
function draw(){el('switch').innerHTML=names.map((n,i)=>btn(labels[i]+' · '+n,'data-mode="'+i+'" aria-pressed="'+(i===mode)+'"',mode===i?'on':'')).join('');
el('screen').innerHTML=head()+[a,b,c][mode]()+'<details class="note"><summary>사업 개요와 분석 범위</summary><p>도시 데이터 플랫폼의 연간 운영·유지관리 사업입니다. 예시 제안요청서 정정 1차의 참가·장비·인력·운영·시험 관련 절에서 필수 요구 5건을 대조했습니다. 회사 수행 기준, 인력 경력표, 수행·시험 증빙을 사용했습니다.</p></details><div class="bar foot"><span>예시 공고 · 원문과 회사 증빙은 시안용 자료입니다.</span>'+btn(read?'결과 읽음':'결과 읽음 표시','data-read','text')+'</div>'}
function openDialog(html){lastFocus=document.activeElement;el('inside').innerHTML=html;el('modal').showModal()}
function escClose(){el('modal').close()}
el('modal').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();else document.querySelector('[data-decide]').focus()});
document.addEventListener('click',e=>{let t=e.target.closest('button');if(!t)return;let d=t.dataset;
if('mode' in d){mode=Number(d.mode);history.replaceState(null,'','?v='+(mode+1));draw()}
else if('pick' in d){chosen=Number(d.pick);draw();document.querySelector('[data-pick="'+chosen+'"]').focus()}
else if('close' in d)escClose();
else if('source' in d){let i=Number(d.source);openDialog('<h2>원문과 회사 근거</h2>'+sheet(i)+'<div class="review">'+reasoning(i)+'</div>')}
else if('task' in d){if(record&&record.verdict!=='미확인'){openDialog('<h2>이 공고의 확인 기록</h2>'+pill(record.verdict)+'<p>'+safe(record.answer)+'</p><small>근거</small><p>'+safe(record.proof)+'</p>');return}openDialog('<h2>착수일에 전담 인력을 배정할 수 있나요?</h2><p class="copy">기술책임자의 답변과 배정 근거를 이 공고의 MHR-02에 기록합니다.</p><form id="verify"><label class="dialogfield"><span>확인 결과</span><select name="verdict"><option>충족</option><option>부족</option><option>미확인</option></select></label><label class="dialogfield"><span>확인한 내용</span><textarea required name="answer"></textarea></label><label class="dialogfield"><span>근거 자료 또는 답변 출처</span><textarea required name="proof"></textarea></label><button class="primary">이 공고에 저장</button></form>')}
else if('decide' in d){openDialog('<h2>추적 결정</h2><p>예비 서버 납품 조건과 미확인 항목을 고려해 추적 상태를 선택하세요. 남은 질문은 상세에 유지됩니다.</p><div class="controls">'+['계속 추적','보류','종료'].map(x=>btn(x,'data-track="'+x+'"')).join('')+'</div>')}
else if('track' in d){track=d.track;escClose();draw()}
else if('read' in d){read=true;draw()}});
document.addEventListener('submit',e=>{if(e.target.id!=='verify')return;e.preventDefault();let data=Object.fromEntries(new FormData(e.target));if(!data.answer.trim()||!data.proof.trim())return;record=data;escClose();draw()});draw();
</script></html>

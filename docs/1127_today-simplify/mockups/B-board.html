.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 18px}

.col-f{margin-top:auto;padding:10px 18px 14px;border-top:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px}
.stat + .stat{border-top:1px solid var(--line-soft)}
.stat .k{font-weight:600}
.stat .k .meta{display:block;font-weight:400}
.stat .v{font-size:22px;font-weight:700}
.quiet{padding:14px 18px;font-size:13px;color:var(--text-2);border-top:1px solid var(--line-soft)}

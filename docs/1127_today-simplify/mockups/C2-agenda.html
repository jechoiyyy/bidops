<link rel="stylesheet" href="./shell.css">

<style>
.wrap{display:flex;flex-direction:column;gap:16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum a{padding:12px 20px;display:flex;align-items:baseline;gap:10px}
.sum a + a{border-left:1px solid var(--line)}
.sum a:hover{background:var(--fill)}
.sum .v{font-size:24px;font-weight:700}
.sum .k{font-weight:600}
.sum .cap{margin-left:auto;font-size:12.5px}
.sum a.hot .v{color:var(--danger)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h .cap{margin-right:auto}

.agenda{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day{display:grid;grid-template-columns:96px minmax(0,1fr);border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.rail{padding:10px 14px;background:var(--fill);display:flex;flex-direction:column;gap:0;border-right:1px solid var(--line)}
.rail b{font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.rail .cap{font-size:12px}
.rail .d{font-size:12.5px;font-weight:700;color:var(--text-2);margin-top:2px}
.rail .d.hot{color:var(--danger)}
.day.quiet .rail{padding:6px 14px;flex-direction:row;align-items:baseline;gap:6px}
.day.quiet .rail b{font-size:13px}
.day.quiet .nil{margin:0;padding:6px 16px;font-size:12.5px;color:var(--text-3)}
.opps{list-style:none;margin:0;padding:0}
.opp{display:grid;grid-template-columns:minmax(0,1fr) 300px 92px 96px;gap:16px;align-items:center;padding:8px 16px}
.opp + .opp{border-top:1px solid var(--line-soft)}
.opp:hover{background:#FBFAF9}
.opp .who{display:flex;flex-direction:column;min-width:0}
.opp .ttl{font-size:14.5px}
.opp .meta b{color:var(--text-1);font-weight:600}
/* 단계 진행: 발주계획 → 사전규격 → 입찰공고 */
.chain{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.chain .s{padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--text-3)}
.chain .s.done{border-color:transparent;background:var(--fill);color:var(--text-2)}
.chain .s.now{border-color:var(--danger);color:var(--danger);font-weight:700;background:var(--danger-tint)}
.chain .s.now.gng{border-color:var(--brand);color:var(--brand-tint-text);background:var(--brand-tint)}
.chain i{width:8px;height:1px;background:var(--line);display:inline-block}
.time{font-size:12.5px;color:var(--text-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.time b{display:block;color:var(--text-1);font-size:13px}
.st{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.st .meta{font-size:11.5px}
.foot{display:flex;gap:24px;align-items:center;padding:10px 16px;border-radius:10px;background:var(--fill);font-size:13px}
.foot .k{font-weight:700}
.foot a{text-decoration:underline;text-underline-offset:2px}
</style>
</head>

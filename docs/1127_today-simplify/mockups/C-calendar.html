<style>
.wrap{display:flex;flex-direction:column;gap:20px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sum a{padding:14px 20px;display:flex;align-items:baseline;gap:10px}
.sum a + a{border-left:1px solid var(--line)}
.sum a:hover{background:var(--fill)}
.sum .v{font-size:26px;font-weight:700}
.sum .k{font-weight:600}
.sum .cap{margin-left:auto;font-size:12.5px}
.sum a.hot .v{color:var(--danger)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec-h .cap{margin-right:auto}
.cal{display:grid;grid-template-columns:0.6fr 1.5fr 1.5fr 1.5fr 0.6fr 0.6fr 0.6fr 1.5fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day{min-height:240px;display:flex;flex-direction:column;border-left:1px solid var(--line-soft);min-width:0}
.day:first-child{border-left:0}
.day.wk{background:#FBFAF9}
.day.later{background:var(--fill);border-left:1px solid var(--line)}
.dh{padding:8px 10px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:6px;font-size:13px}
.dh b{font-size:15px}
.dh .cap{font-size:12px}
.dh .d{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-2)}
.today .dh{background:var(--brand-tint)}
.today .dh b{color:var(--brand-tint-text)}
.chips{display:flex;flex-direction:column;gap:6px;padding:8px}
.chip{display:block;border-radius:8px;padding:7px 8px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--danger);font-size:12.5px;line-height:1.4}
.chip .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip .m{color:var(--text-2);font-size:11.5px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.gng{border-left-color:var(--brand)}
.nil{font-size:12px;color:var(--text-3);padding:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.foot{display:flex;gap:24px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--fill);font-size:13px}
.foot .k{font-weight:700}
.foot a{text-decoration:underline;text-underline-offset:2px}
</style>
</head>

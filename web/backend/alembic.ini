[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# env.py injects BIDOPS_DATABASE_URL and refuses anything but PostgreSQL 17.
# No default URL is configured here so a stray `alembic` invocation cannot
# silently migrate a local file database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

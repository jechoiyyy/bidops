# RL-01 평일 브리핑 Slack egress overlay.
#
# `build-briefing --send`가 도는 web(`chat.postMessage`)과 Socket Mode worker
# `slack-worker`(`apps.connections.open`·websocket·`chat.update`) 두 서비스에만
# env 파일 `env/slack.env`와 egress network를 준다. 이 파일을 붙이지 않으면 기반
# 스택의 내부망 격리가 그대로이고 BIDOPS_SLACK_ENABLED 기본값 false로 아무것도
# 보내지 않는다. env 파일이 없으면 compose가 기동 전에 멈춘다.
#
# 호출 전 검사(enabled·토큰·채널·허용 host)는 앱의 `app/core/slack.py`가 한다.
# host 방화벽에서 slack.com·wss-primary.slack.com(443) 외 egress를 막은 뒤에만
# 사용한다. 토큰은 env 파일에만 두고 이 파일·이미지·명령줄에 적지 않는다.
#
#   cp env/slack.env.example env/slack.env   # 값 채우기(gitignore)
#   # 아래는 기반+edge만 쓰는 예시다. 운영은 docs/operations.md의 파일·env 조합 전체
#   # (model-egress·prespec·c2 overlay 포함)에 이 파일을 더한다. 일부만 넘겨 web을
#   # 재생성하면 그 설정이 빠진 채 올라온다.
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml \
#     -f docker-compose.slack-egress.yml --profile slack \
#     up -d --no-deps --force-recreate web slack-worker
services:
  web:
    env_file: [env/slack.env]
    networks: [slack-egress]

  slack-worker:
    env_file: [env/slack.env]
    networks: [slack-egress]

networks:
  slack-egress:

# 이 파일은 SQLite migration 입력 스냅숏을 다루는 operator 도구만 담는다.
# 애플리케이션 런타임(`web`, `document-worker`, `analysis-worker`)은
# `docker-compose.yml`이 담당한다.
# 모든 서비스는 `ops` profile이므로 인자 없는 `docker compose up`은 아무것도 띄우지 않는다.

x-bidops-runtime: &bidops-runtime
  image: bidops-admin:local
  build:
    context: .
    dockerfile: web/Dockerfile
    args:
      BIDOPS_UID: "${BIDOPS_UID:-1000}"
      BIDOPS_GID: "${BIDOPS_GID:-1000}"
  working_dir: /app/web/backend
  user: "${BIDOPS_UID:-1000}:${BIDOPS_GID:-1000}"
  env_file:
    - path: .env
      required: false
  environment:
    # Container paths are explicit so a host .env cannot redirect the DB into
    # the image or into a read-only source tree.
    BIDOPS_ROOT: /app
    BIDOPS_DATA_DIR: /app/web/data
    BIDOPS_ATTACHMENTS_DIR: /app/web/data/attachments
    # 이 SQLite 경로는 정본이 아니라 `db-backup`/`db-migrate`/`db-verify`가
    # 다루는 migration 입력 스냅숏이다.
    BIDOPS_DATABASE_URL: sqlite:////app/web/data/bidops.db
    BIDOPS_SCHEDULER_ENABLED: "${BIDOPS_SCHEDULER_ENABLED:-false}"
    # These are consumed only by the explicitly invoked ops-profile helpers;
    # blank defaults cannot trigger a backup, migration, or policy seed.
    BIDOPS_BACKUP_OUTPUT: "${BIDOPS_BACKUP_OUTPUT:-}"
    BIDOPS_BACKUP_MANIFEST: "${BIDOPS_BACKUP_MANIFEST:-}"
    BIDOPS_CONFIRM_SERVICE_STOPPED: "${BIDOPS_CONFIRM_SERVICE_STOPPED:-false}"
    BIDOPS_POLICY_SEED_ACTOR: "${BIDOPS_POLICY_SEED_ACTOR:-}"
  volumes:
    # Pipeline source artifacts and generated reports are host-visible and
    # durable. The process user must match BIDOPS_UID/BIDOPS_GID.
    - ./data:/app/data
    - ./reports:/app/reports
    # Skills and docs are execution inputs, never container write targets.
    - ./skills:/app/skills:ro
    - ./docs:/app/docs:ro
    # SQLite, attachments, policy/profile snapshots, and audit records survive
    # container recreation. Do not use `down -v` without a verified backup.
    - bidops-web-data:/app/web/data
    - bidops-backups:/app/backups
  entrypoint: ["/usr/local/bin/bidops-entrypoint"]

services:
  # Explicit operator commands. None starts on its own or depends on another
  # service; each is invoked by name after the Compose runtime is stopped.
  # `db-migrate` additionally requires a retained manifest and an explicit
  # service-stopped confirmation in container-ops.sh.
  db-backup:
    <<: *bidops-runtime
    profiles: ["ops"]
    command: ["/usr/local/bin/bidops-ops", "backup"]

  db-migrate:
    <<: *bidops-runtime
    profiles: ["ops"]
    command: ["/usr/local/bin/bidops-ops", "migrate"]

  db-verify:
    <<: *bidops-runtime
    profiles: ["ops"]
    command: ["/usr/local/bin/bidops-ops", "verify"]

  policy-seed:
    <<: *bidops-runtime
    profiles: ["ops"]
    command: ["/usr/local/bin/bidops-ops", "seed-policy"]

volumes:
  bidops-web-data:
  bidops-backups:

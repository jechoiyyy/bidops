# Test-only override for exercising the complete workflow without Qwen.
# It covers both stages: 1차 분류 uses the deterministic screening
# transport and 심층 검토 uses the mock analysis provider. The analysis worker
# remains on the internal database/analysis networks and the provider/model
# lineage is persisted as mock-analysis.
#
# Every value this overlay needs is declared literally below, so it needs no
# env file beyond the shared .env.
#
#   docker compose -f docker-compose.yml \
#     -f docker-compose.mock-reference.yml up -d
services:
  web:
    environment:
      BIDOPS_ANALYSIS_PROVIDER: mock
      BIDOPS_SCREENING_PROVIDER: mock
      BIDOPS_OPENAI_ENABLED: "false"
      BIDOPS_REFERENCE_WORKFLOW_MODE: "true"
  analysis-worker:
    environment:
      BIDOPS_ANALYSIS_PROVIDER: mock
      BIDOPS_SCREENING_PROVIDER: mock
      BIDOPS_OPENAI_ENABLED: "false"
      BIDOPS_REFERENCE_WORKFLOW_MODE: "true"

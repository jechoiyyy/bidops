# Optional override for an operator-approved remote OpenAI-compatible vLLM
# endpoint. This overlay owns its own values; supply them with an extra
# --env-file so the base stack keeps its safe loopback defaults when the
# overlay is not used.
#
#   docker compose --env-file .env --env-file env/vllm.env \
#     -f docker-compose.yml -f docker-compose.remote-vllm.yml \
#     up -d web document-worker analysis-worker
#
# Opening this network is not sufficient: restrict egress to that IP/port at
# the host firewall and keep the allowlist identical to the endpoint IP.
#
# 여기 주는 BIDOPS_VLLM_* 는 overview·deep_review 용도의 공유값이다. 용도별로
# 다른 endpoint를 쓰려면 BIDOPS_VLLM_OVERVIEW_* / BIDOPS_VLLM_DEEP_REVIEW_* 를
# 추가로 준다. 허용 host가 비었거나 선언 revision이 64자 hex가 아니면 그 용도는
# 네트워크 호출 전에 fail closed한다(ADR-0050).
services:
  web:
    environment:
      BIDOPS_C2_EXECUTION_ALLOWED: "${BIDOPS_C2_EXECUTION_ALLOWED:-false}"
      BIDOPS_C2_CAPABILITIES_PATH: /run/c2/company-capabilities.json
      BIDOPS_C2_PROMPT_PATH: /run/c2/order-plan-prompt.txt
    volumes:
      - "${BIDOPS_C2_CAPABILITIES_HOST_PATH:?set an explicit approved capabilities file path}:/run/c2/company-capabilities.json:ro"
      - "${BIDOPS_C2_PROMPT_HOST_PATH:?set an explicit approved prompt file path}:/run/c2/order-plan-prompt.txt:ro"
  analysis-worker:
    environment:
      BIDOPS_VLLM_BASE_URL: "${BIDOPS_VLLM_BASE_URL:?set an approved vLLM endpoint in env/vllm.env}"
      BIDOPS_VLLM_ALLOWED_HOSTS: "${BIDOPS_VLLM_ALLOWED_HOSTS:?set the literal allowed host in env/vllm.env}"
      BIDOPS_VLLM_API_KEY: "${BIDOPS_VLLM_API_KEY:-EMPTY}"
      BIDOPS_VLLM_MODEL_REVISION: "${BIDOPS_VLLM_MODEL_REVISION:?set the operator-attested 64-hex model revision in env/vllm.env}"
      BIDOPS_C2_EXECUTION_ALLOWED: "${BIDOPS_C2_EXECUTION_ALLOWED:-false}"
      BIDOPS_C2_CAPABILITIES_PATH: /run/c2/company-capabilities.json
      BIDOPS_C2_PROMPT_PATH: /run/c2/order-plan-prompt.txt
    volumes:
      - "${BIDOPS_C2_CAPABILITIES_HOST_PATH:?set an explicit approved capabilities file path}:/run/c2/company-capabilities.json:ro"
      - "${BIDOPS_C2_PROMPT_HOST_PATH:?set an explicit approved prompt file path}:/run/c2/order-plan-prompt.txt:ro"
    networks: [database, analysis, model-egress]

networks:
  model-egress:
